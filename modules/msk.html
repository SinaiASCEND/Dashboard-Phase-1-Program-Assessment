<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Musculoskeletal — Module Dashboard</title>
<style>
:root{--navy:#221F72;--mag:#D80B8C;--cyan:#00AEEF;--text:#374151;--grey:#6B7280;--line:#E2E5EE;--light:#F4F5FA;--pink:#FBE3F0;--tint:#EAF8FE;--green:#0E8A5F;--mint:#E3F5EE}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--text);font-size:15px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:22px 28px 0}.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.brand .lock{font-weight:800;letter-spacing:.06em;font-size:14px}.brand .lock span{color:var(--cyan)}.brand .sub{font-size:12px;opacity:.75}.brand a{color:#fff;opacity:.85}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}section.view{display:none}section.view.on{display:block}

.stat{background:var(--light);border-left:4px solid var(--navy);padding:14px 16px}.stat.green{border-left-color:var(--green)}.stat.mag{border-left-color:var(--mag)}.stat.cyan{border-left-color:var(--cyan)}
.stat .n{font-size:32px;font-weight:800;color:var(--navy);line-height:1}.stat.green .n{color:var(--green)}.stat.mag .n{color:var(--mag)}.stat .l{font-size:13px;font-weight:600;margin-top:6px}.stat .s{font-size:12px;color:var(--grey);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 4px}th{background:var(--navy);color:#fff;text-align:left;padding:8px 9px;font-weight:600;font-size:12.5px}td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}tr:nth-child(even) td{background:var(--light)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td.c,th.c{text-align:center}
.note{font-size:12.5px;color:var(--grey);margin:4px 0 12px}.band{display:inline-block;padding:1px 7px;border-radius:3px;font-size:12px;font-weight:600}.b0{background:var(--pink);color:var(--mag)}.b1{background:#FFF1D6;color:#9A5B00}.b2{background:var(--tint);color:#0B6E9C}.b3{background:var(--mint);color:var(--green)}.bx{background:var(--pink);color:var(--mag)}
.card{border:1px solid var(--line);padding:14px 16px}.card p{margin:6px 0}ul.themes{margin:6px 0;padding-left:0;list-style:none}ul.themes li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}ul.themes li b{min-width:44px;color:var(--navy)}
.chart{background:#fff;border:1px solid var(--line);padding:10px 12px}.chart svg{max-width:760px;display:block}.legend{font-size:12px;color:var(--grey);margin-top:6px}.sw{display:inline-block;width:11px;height:11px;margin:0 4px 0 10px;vertical-align:-1px}.pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--light);color:var(--grey);margin-left:6px}
footer{border-top:1px solid var(--line);margin-top:40px;padding:14px 20px;font-size:12px;color:var(--grey);text-align:center}
@media(max-width:680px){table.stack-m thead{display:none}table.stack-m tr{display:block;border:1px solid var(--line);margin-bottom:8px}table.stack-m td{display:flex;justify-content:space-between;text-align:right}table.stack-m td::before{content:attr(data-label);font-weight:600;text-align:left;color:var(--navy);margin-right:10px}}
@media print{nav{display:none}section.view{display:block!important}}
</style></head><body>
<header><div class="brand"><div class="lock">ASCEND <span>|</span> Mount Sinai</div><div class="sub"><a href="../index.html">ASCEND Programmatic Assessment — Phase 1</a> · Module Director Dashboard</div></div>
<h1 id="ttl"></h1><div class="meta" id="meta"></div>

<main><section class="view on" id="v-module"></section><section class="view" id="v-assess"></section><section class="view" id="v-curric"></section></main>
<footer id="foot"></footer>
<script>
const D={"module": {"name": "Musculoskeletal", "short": "MSK", "code": "", "term": "Fall 2025", "cohort": "ASCEND Class of 2028", "year": "AY 2025\u201326", "n": 119, "passing": 65, "source": "AY 2025\u201326 Module Review (Blackboard Grade Center; CODA calendar; NBME Percent Correct Report OB-00168740-1)"}, "grading": [["CCSG (6 \u00d7 1.67%)", null], ["Quizzes (3 \u00d7 10%)", null], ["End-of-Module NBME exam", null]], "grading_note": "Component weights are not stated in the review; the review lists CCSG 6 \u00d7 1.67% and Quizzes 3 \u00d7 10%, which would leave 60% for the End-of-Module exam. To be confirmed.", "final": {"mean": 88, "median": 89, "sd": 6, "labels": ["<65", "65\u201369", "70\u201374", "75+"], "bands": [0, 0, 5, 114], "pass": 119, "fail": 0, "incomplete": 0}, "summative": [{"name": "End-of-Module NBME exam", "pts": 57, "target": 77, "mean": 85, "sd": 7, "median": 87, "range": null, "labels": ["<65", "65\u201369", "70\u201374", "75+"], "bands": [1, 1, 9, 108]}], "formative": [{"name": "Quiz 1", "items": 10, "mean": 95, "median": 100, "range": "60\u2013100", "labels": ["<65", "65\u201369", "70\u201374", "75+"], "bands": [1, 0, 2, 109]}, {"name": "Quiz 2", "items": 11, "mean": 90, "median": 91, "range": "55\u2013100", "labels": ["<65", "65\u201369", "70\u201374", "75+"], "bands": [8, 0, 5, 103]}], "formative_note": "The review reports two quizzes; the grading table lists three.", "evaluation": {"n": 52, "rate": "40%", "col_prior": "Legacy curriculum 2024\u201325 (n = 45)", "col": "ASCEND 2025\u201326 (Class of 2028, n = 52)", "prior_n": 45, "items": [["This module had high educational impact**", 86, 88], ["Exams assessed concepts stated in the learning objectives and emphasized in class**", 95, 90], ["Organization and flow of course content*", 82, 65], ["Overall faculty teaching*", 84, 69], ["Session materials and schedules were posted in a timely manner", 100, 87], ["The module content included illustrations of clinical relevance**", 93, 87], ["The Module Director cared about the students, their progress, and successful course completion**", 98, 85], ["The Module Director was available to students**", 100, 85], ["The Module Director was responsive to student feedback**", 98, 85], ["The module learning objectives helped support learning in this module**", 98, 85], ["The module learning objectives were clearly stated**", 98, 86], ["The module workload was manageable**", 100, 90], ["This module was useful in progress towards preparing for STEP 1**", 86, 87]], "strengths": [[38, "N/A: 'Not applicable' or 'None'"], [29, "Curriculum: organization of content; linkage with STEP"], [13, "Educator/teaching: general references to educators"], [10, "MD: positive references to module directors"]], "suggestions": [[46, "N/A: 'Not applicable' or 'None'"], [15, "Curriculum: organization of content; integration of dermatology"], [15, "TBL: students do not see the utility of the session"], [10, "Lectures: suggestions to improve slides"]], "ops": ["There was a delay in the responsiveness to emails and frequent follow-up emails were sent to module directors. At times Rachel would have to speak to them in person to receive any updates or information.", "Though the CCSG was split in 2 sessions and only 5 preceptors were needed, the CCSG roster was created significantly late due to a lack of a 5th preceptor. The module director was unaware of the standard 10 groups that are maintained throughout the semester until the module planning meeting. It was very challenging for them to find an additional preceptor.", "The lab roster was also created significantly later in the module due to lack of preceptors. However, the labs went smoothly.", "There was some miscommunication regarding the details for set-up of the gRAT. The first set of students were unable to take it on Blackboard during the TBL session as planned. The questions were updated when Rachel received clarification and the second set of students were able to take the assessment."]}, "hours": {"rows": [["Lecture", 30, 30], ["Lab", 2, 2], ["Review", 1, 2], ["TBL", 1, 1.5], ["CCSG", 1, 1], ["Large group discussion", 1, 1]], "total": 37.5}, "mapping": [["PC 1. Gather essential and accurate information about patients and their conditions through history-taking, physical examination, and the use of laboratory data, imaging, and other tests", ["Demonstrate the principles of assessing musculoskeletal disorders through history-taking, physical examination, and the introductory use of diagnostic imaging such as radiography"]], ["PC 3. Make informed decisions about diagnostic and therapeutic interventions", ["Outline basic management plans for musculoskeletal conditions, integrating non-pharmacological and pharmacological treatments, and outlining the roles of surgical interventions and physical rehabilitation", "Analyze hypothetical clinical case scenarios to explore multidisciplinary approaches in the management of musculoskeletal issues", "Describe the principles of rehabilitation including physical therapy modalities and exercises tailored for various musculoskeletal conditions to restore function and reduce pain"]], ["PC 5. Counsel and educate patients and their families so that they can participate in their care and enable shared decision making", ["Describe the principles of rehabilitation including physical therapy modalities and exercises tailored for various musculoskeletal conditions"]], ["PC 7. Provide health care services to patients, families, and communities aimed at maintaining health and wellbeing", ["Evaluate the impact of chronic musculoskeletal diseases on patients' quality of life, emphasizing the integration of social determinants of health into comprehensive care plans"]], ["KP 8. Apply knowledge of the biomedical sciences to care for patients", ["Identify and describe the anatomy and physiology of the musculoskeletal system, focusing on the structural features and functions of bones, muscles, joints, and connective tissues", " if(!F){document.querySelector('nav button[data-v="module"]').remove();document.querySelector('nav button[data-v="assess"]').remove();document.querySelector('nav button[data-v="curric"]').classList.add('on');$('#v-module').classList.remove('on');$('#v-curric').classList.add('on')}else if(!D.summative||!D.summative.length){document.querySelector('nav button[data-v="assess"]').remove()}
const pct=(n,d)=>d?Math.round(100*n/d)+'%':'—';const fmt=v=>v==null?'—':v;
$('#ttl').textContent=`${M.name}${M.code?` (${M.code})`:''} — ${M.cohort}`;$('#meta').textContent=`${M.term} · ${M.year}${M.n?` · ${M.n} students`:''} · ${F?'Review-level data (no item-level analysis on file)':'Student evaluation only — module review not yet on file'}`;
$('#foot').textContent=`Aggregate data only. Source: ${M.source}. Prepared by the Office of Curricular Affairs.`;
function bandRow(labels,bands,n){return labels.map((l,i)=>{const cls=labels.length===5?(i<2?'bx':i===2?'b1':i===3?'b2':'b3'):'b'+i;return `<td class="c" data-label="${l}"><span class="band ${cls}">${bands[i]}</span><br><small>${pct(bands[i],n)}</small></td>`}).join('')}

function hbars(rows,opts={}){const W=560,rh=22,x0=opts.x0||170,H=rows.length*rh+22,sc=(W-x0-60)/100;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;[0,25,50,75,100].forEach(g=>{const x=x0+g*sc;s+=`<line x1="${x}" y1="4" x2="${x}" y2="${H-18}" stroke="#E2E5EE"/><text x="${x}" y="${H-5}" font-size="10" fill="#6B7280" text-anchor="middle">${g}%</text>`});rows.forEach((r,i)=>{const y=6+i*rh;s+=`<text x="${x0-6}" y="${y+12}" font-size="11" fill="#374151" text-anchor="end">${r.label}</text><rect x="${x0}" y="${y+2}" width="${r.v*sc}" height="12" fill="${r.color||'#221F72'}"/>`;if(r.prior!=null)s+=`<rect x="${x0+r.prior*sc-1}" y="${y}" width="2" height="16" fill="#D80B8C"/>`;s+=`<text x="${x0+r.v*sc+4}" y="${y+12}" font-size="10.5" fill="#374151">${r.v}${r.suffix||'%'}</text>`});return s+'</svg>'}
// MODULE
(function(){if(!F)return;let h=`<h2>Outcome</h2><div class="grid g4">
${F.mean!=null?`<div class="stat"><div class="n">${F.mean}%</div><div class="l">Mean final module grade</div><div class="s">median ${F.median} · SD ${F.sd}</div></div>`:`<div class="stat"><div class="n">P/F</div><div class="l">Pass by completion</div><div class="s">${M.passing}</div></div>`}
<div class="stat green"><div class="n">${F.pass} / ${F.fail}</div><div class="l">Pass / fail</div><div class="s">${F.incomplete} incomplete · of ${M.n}</div></div>
${F.bands?`<div class="stat mag"><div class="n">${F.bands[1]}</div><div class="l">Within 5 points of passing (65–69%)</div><div class="s">${F.bands[0]} below 65%</div></div><div class="stat cyan"><div class="n">${F.bands[3]}</div><div class="l">At or above 75%</div><div class="s">${pct(F.bands[3],M.n)} of the cohort</div></div>`:``}</div>`;
if(F.bands)h+=`<h3>Final module grade bands</h3><table class="stack-m"><thead><tr><th></th>${bandHead(F.labels)}</tr></thead><tbody><tr><td>Final module grade</td>${bandRow(F.labels,F.bands,M.n)}</tr></tbody></table><p class="note">Passing = ${M.passing}%.${D.final_note?' '+D.final_note:''}</p>`;else h+=`<p class="note">${D.final_note||''}</p>`;

$('#v-module').innerHTML=h})();
// ASSESSMENTS
(function(){if(!D.summative||!D.summative.length)return;let h=`<h2>Summative assessment results</h2>`;const l5=D.summative.some(s=>s.labels.length===5);

h+=`</tbody></table><p class="note">Bands as reported in the module review. Where five bands are shown, the review splits below-65 into &lt;60 and 60–64.${D.summative_note?' '+D.summative_note:''}</p>`;

if(D.formative.length){h+=`<table class="stack-m"><thead><tr><th>Quiz</th><th class="num">Items</th><th class="num">Mean</th><th class="num">Median</th><th class="num">Range</th>${bandHead(D.formative[0].labels)}</tr></thead><tbody>${D.formative.map(q=>`<tr><td data-label="Quiz"><b>${q.name}</b></td><td class="num" data-label="Items">${q.items}</td><td class="num" data-label="Mean"><b>${q.mean}</b></td><td class="num" data-label="Median">${q.median}</td><td class="num" data-label="Range">${q.range}</td>${bandRow(q.labels,q.bands,M.n)}</tr>`).join('')}</tbody></table>`}

(function(){const E=D.evaluation;const last=i=>i[i.length-1],prev=i=>i[i.length-2];let h=`<h2>Student evaluation of module <span class="pill">${M.cohort} · ${M.year}</span></h2><p class="note">${E.n} students (${E.rate}) completed the evaluation.${E.col_prior?` Comparison column: ${E.col_prior}.`:''} * % Good + Excellent; ** % Agree + Strongly Agree.${E.note?' '+E.note:''}</p>`;
