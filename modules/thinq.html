<script>

const $=s=>document.querySelector(s);
const f1=v=>v==null?'—':Number(v).toFixed(1);
const pct=(n,d)=>d?Math.round(100*n/d)+'%':'—';
const fmt=v=>v==null?'—':v;
const trend=(a,b,thr=3)=>{if(a==null||b==null)return '<span class="tr na">—</span>';const d=b-a;const s=(d>0?'+':'')+(Number.isInteger(d)?d:d.toFixed(1));if(d>=thr)return `<span class="tr up" data-tip="Up ${s} points versus the prior cohort or year">▲ ${s}</span>`;if(d<=-thr)return `<span class="tr down" data-tip="Down ${s} points versus the prior cohort or year">▼ ${s}</span>`;return `<span class="tr flat" data-tip="Stable: ${s} points versus prior, within the ±${thr}-point band">● ${s}</span>`};
const TRLEG='<p class="note">Trend vs prior: <span class="tr up">▲</span> up 3 points or more · <span class="tr flat">●</span> stable (within ±3) · <span class="tr down">▼</span> down 3 points or more.</p>';
function hist(counts,edges,opts={}){const W=560,H=200,x0=34,y0=170,mx=Math.max(...counts,1)*1.15,pw=(W-x0-10)/counts.length,sc=(y0-14)/mx;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 for(let g=0;g<=mx;g+=Math.ceil(mx/4)){const y=y0-g*sc;s+=`<line x1="${x0}" y1="${y}" x2="${W-10}" y2="${y}" stroke="#E2E5EE"/><text x="${x0-4}" y="${y+4}" font-size="10" fill="#6B7280" text-anchor="end">${g}</text>`}
 counts.forEach((c,i)=>{const x=x0+i*pw;const lo=edges[i],hi=edges[i+1];const col=opts.color||'#221F72';s+=`<rect x="${x+3}" y="${y0-c*sc}" width="${pw-6}" height="${c*sc}" fill="${col}"/><text x="${x+pw/2}" y="${y0-c*sc-3}" font-size="10" fill="#374151" text-anchor="middle">${c}</text><text x="${x+pw/2}" y="${y0+13}" font-size="10" fill="#6B7280" text-anchor="middle">${lo}–${i<counts.length-1?hi-1:hi}</text>`});
 if(opts.line!=null){const x=x0+(opts.line-edges[0])/(edges[1]-edges[0])*pw;s+=`<line x1="${x}" y1="6" x2="${x}" y2="${y0}" stroke="#D80B8C" stroke-width="2" stroke-dasharray="5,4"/><text x="${x+4}" y="14" font-size="11" fill="#D80B8C" font-weight="700">${opts.lineLabel||opts.line}</text>`}
 return s+'</svg>'}
function wrap(s,n){const w=s.split(' ');const lines=[];let cur='';w.forEach(x=>{if((cur+' '+x).trim().length>n&&cur){lines.push(cur);cur=x}else cur=(cur+' '+x).trim()});if(cur)lines.push(cur);return lines.slice(0,3)}
function hbars(rows,opts={}){const W=560,x0=opts.x0||170,wide=x0>250,fs=wide?9:11,maxc=wide?Math.floor((x0-10)/4.6):26;const L=rows.map(r=>wide?wrap(r.label,maxc):[r.label]);const rh=L.map(l=>Math.max(16,l.length*(fs+2)+6));const H=rh.reduce((a,b)=>a+b,0)+26,sc=(W-x0-60)/100;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 (wide?[0,25,50,75,100]:[50,60,70,80,90,100]).forEach(g=>{const x=x0+g*sc;s+=`<line x1="${x}" y1="4" x2="${x}" y2="${H-18}" stroke="#E2E5EE"/><text x="${x}" y="${H-5}" font-size="10" fill="#6B7280" text-anchor="middle">${g}%</text>`});
 let y=6;rows.forEach((r,i)=>{const h=rh[i],lines=L[i],by=y+h/2-6;const ty=y+h/2-(lines.length-1)*(fs+2)/2+fs/2-1;lines.forEach((ln,k)=>{s+=`<text x="${x0-6}" y="${ty+k*(fs+2)}" font-size="${fs}" fill="#374151" text-anchor="end">${ln}</text>`});if(r.v!=null)s+=`<rect x="${x0}" y="${by}" width="${r.v*sc}" height="12" fill="${r.color||'#221F72'}"/>`;if(r.prior!=null)s+=`<rect x="${x0+r.prior*sc-1}" y="${by-2}" width="2" height="16" fill="#D80B8C"/>`;if(r.v!=null)s+=`<text x="${x0+r.v*sc+4}" y="${by+10}" font-size="10.5" fill="#374151">${Number.isInteger(r.v)?r.v:f1(r.v)}${r.suffix||'%'}</text>`;y+=h});
 return s+'</svg>'}

 (extraFacts||[]).forEach(f=>facts.push(f));if(info&&info.mlos)facts.push([info.mlos.length,'Learning objectives']);if(info&&info.mepo_coverage)facts.push([info.mepo_coverage.length+' / 23','MEPOs mapped']);

 if(info){h+=`<p class="desc">${info.description}</p>`;if(info.goals&&info.goals.length)h+=`<h3>Module goals</h3><ul class="goals">${info.goals.map(g=>`<li>${g}</li>`).join('')}</ul>`;

<div class="legend"><span class="mchip mA">A</span>Patient Care <span class="mchip mB">B</span>Knowledge for Practice <span class="mchip mC">C</span>Practice-Based Learning and Improvement <span class="mchip mE">E</span>Professionalism <span class="mchip mG">G</span>Personal and Professional Development <span class="mchip mD">D</span>Interpersonal and Communication Skills <span class="mchip mF">F</span>Systems-Based Practice · Hover or tap a chip for the MEPO text.</div>`;

const isM=()=>window.matchMedia('(max-width:760px) and (hover:none) and (pointer:coarse)').matches;

function sections(){document.querySelectorAll('section.view').forEach(v=>{if(v.querySelector('.sec'))return;const kids=[...v.childNodes];let cur=null,secs=[];const frag=document.createDocumentFragment();
 kids.forEach(k=>{if(k.nodeType===1&&k.tagName==='H2'){cur=document.createElement('div');cur.className='sec';const body=document.createElement('div');body.className='sec-body';cur.appendChild(k);cur.appendChild(body);frag.appendChild(cur);secs.push(cur)}else if(cur){cur.querySelector('.sec-body').appendChild(k)}else frag.appendChild(k)});
 v.innerHTML='';if(isM()&&secs.length>1){const jump=document.createElement('div');jump.className='jump';secs.forEach((s,i)=>{const id=v.id+'-s'+i;s.id=id;const a=document.createElement('a');a.href='#'+id;a.textContent=s.querySelector('h2').textContent.replace(/\(Class of \d+\)/,'').trim();a.addEventListener('click',ev=>{ev.preventDefault();s.classList.remove('closed');s.scrollIntoView({behavior:'smooth',block:'start'})});jump.appendChild(a)});v.appendChild(jump)}
 v.appendChild(frag);secs.forEach((s,i)=>{const h=s.querySelector('h2');h.addEventListener('click',()=>{if(isM()){s.classList.toggle('closed');setTimeout(markScroll,0)}});if(isM()&&i>0)s.classList.add('closed')})})}
function tipsheet(){let sheet=document.getElementById('tipsheet');if(!sheet){sheet=document.createElement('div');sheet.id='tipsheet';sheet.innerHTML='<span class="x">×</span><b></b><span class="t"></span>';document.body.appendChild(sheet);sheet.querySelector('.x').addEventListener('click',()=>sheet.classList.remove('on'));document.addEventListener('click',e=>{const c=e.target.closest('[data-tip]');if(!c){if(!e.target.closest('#tipsheet'))sheet.classList.remove('on');return}if(!isM())return;sheet.querySelector('b').textContent=c.textContent.trim();sheet.querySelector('.t').textContent=c.getAttribute('data-tip');sheet.classList.add('on')})}}
function mobilize(){sections();wrapTables();setTimeout(markScroll,0)}
window.addEventListener('resize',()=>setTimeout(markScroll,0));
function tabs(){tipsheet();mobilize();document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('section.view').forEach(s=>s.classList.remove('on'));$('#v-'+b.dataset.v).classList.add('on');window.scrollTo({top:0})}))}
