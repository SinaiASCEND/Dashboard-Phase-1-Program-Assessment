<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THINQ — Module Dashboard</title>
<style>
:root{--navy:#221F72;--mag:#D80B8C;--cyan:#00AEEF;--text:#374151;--grey:#6B7280;--line:#E2E5EE;--light:#F4F5FA}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--text);font-size:15px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:22px 28px 0}.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.brand .lock{font-weight:800;letter-spacing:.06em;font-size:14px}.brand .lock span{color:var(--cyan)}.brand .sub{font-size:12px;opacity:.75}.brand a{color:#fff;opacity:.85}
h1{margin:10px 0 2px;font-size:26px}.meta{font-size:13px;opacity:.85;margin-bottom:14px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:transparent;border:0;color:#fff;opacity:.7;padding:10px 16px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}nav button.on{opacity:1;border-bottom-color:var(--mag)}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}section.view{display:none}section.view.on{display:block}
h2{font-size:19px;color:var(--navy);margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}h2:first-child{margin-top:4px}h3{font-size:15px;color:var(--navy);margin:18px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 4px}th{background:var(--navy);color:#fff;text-align:left;padding:8px 9px;font-weight:600;font-size:12.5px}td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}tr:nth-child(even) td{background:var(--light)}td.num,th.num{text-align:right}
.note{font-size:12.5px;color:var(--grey);margin:4px 0 12px}.card{border:1px solid var(--line);padding:14px 16px}.grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}@media(max-width:700px){.grid{grid-template-columns:1fr}}
ul.themes{margin:6px 0;padding-left:0;list-style:none}ul.themes li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}ul.themes li b{min-width:44px;color:var(--navy)}
.chart{background:#fff;border:1px solid var(--line);padding:10px 12px}.chart svg{max-width:760px;display:block}.legend{font-size:12px;color:var(--grey);margin-top:6px}.sw{display:inline-block;width:11px;height:11px;margin:0 4px 0 10px;vertical-align:-1px}.pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--light);color:var(--grey);margin-left:6px}
.up{color:#0E8A5F}.down{color:var(--mag)}footer{border-top:1px solid var(--line);margin-top:40px;padding:14px 20px;font-size:12px;color:var(--grey);text-align:center}
@media(max-width:680px){table.stack-m thead{display:none}table.stack-m tr{display:block;border:1px solid var(--line);margin-bottom:8px}table.stack-m td{display:flex;justify-content:space-between;text-align:right}table.stack-m td::before{content:attr(data-label);font-weight:600;text-align:left;color:var(--navy);margin-right:10px}}
</style></head><body>
<header><div class="brand"><div class="lock">ASCEND <span>|</span> Mount Sinai</div><div class="sub"><a href="../index.html">ASCEND Programmatic Assessment — Phase 1</a> · Module Director Dashboard</div></div>
<h1 id="ttl"></h1><div class="meta" id="meta"></div><nav id="nav"></nav></header>
<main id="main"></main><footer id="foot"></footer>
<script>
const D={"module": {"name": "THINQ \u2014 The Inquiry Curriculum", "short": "THINQ", "term": "Longitudinal", "year": "AY 2025\u201326", "n": null, "source": "AY 2025\u201326 THINQ evaluation summaries (Year 1 Semesters 1\u20132, Semester 3); no graded assessments"}, "intro": "THINQ runs monthly across all three Phase 1 semesters and consolidates the four Areas of Concentration (PCA, SSD, LPI, HDS) plus evidence-based medicine. It is evaluated by semester; it carries no graded assessments, so this dashboard has no grade or assessment tabs.", "semesters": [{"label": "Year 1 \u2014 Semester 1", "cohort": "ASCEND Class of 2029", "term": "Fall 2025", "n": 82, "rate": "63%", "col_prior": "2024\u201325 (Class of 2028, n = 39)", "col": "2025\u201326 (Class of 2029, n = 82)", "items": [["This module had high educational impact (24\u201325) / offered meaningful learning opportunities (25\u201326)**", 41, 80], ["Session materials and schedules were posted in a timely manner**", 77, 95], ["The Module Director cared about the students, their progress, and successful course completion**", 74, 97], ["The Module Director was responsive to student feedback**", 72, 97], ["The module learning objectives were clearly defined (24\u201325) / helped support learning (25\u201326)**", 59, 77], ["The module workload was manageable**", 79, 96]], "aoc": [["Healthcare Delivery Science", 81, 91, 89], ["Patient-Centered Advocacy", 81, 93, 86], ["Scientific & Scholarly Discovery", 81, 85, 79], ["Leadership & Professional Identity", 79, 89, 87]], "strengths": [[33, "Curriculum: exposure to areas outside the traditional science curriculum; supports identity formation"], [14, "Selective choice: opportunity for students to choose what they want to attend"], [13, "Selective: engaging; interesting"], [13, "N/A: 'Not applicable' or 'None'"], [12, "Small groups: positive mentions of working in small groups"], [12, "Educators: engaging speakers; variety of speakers"]], "suggestions": [[28, "Curriculum LGS: large group sessions are too long / give more time to small groups; not engaging / make more interactive"], [28, "N/A: 'Not applicable' or 'None'"], [27, "Curriculum: suggestion to improve specific AOC content; more balanced representation of AOCs; make content practical/actionable"]]}, {"label": "Year 1 \u2014 Semester 2", "cohort": "ASCEND Class of 2029", "term": "Spring 2026", "n": 31, "rate": "24%", "col_prior": "Semester 2, 2024\u201325 (Class of 2028, n = 26)", "col": "Semester 2, 2025\u201326 (Class of 2029, n = 31)", "items": [["This module had high educational impact**", 50, null], ["Organization and flow of module content*", 63, null], ["Overall faculty teaching*", 75, null], ["Session materials and schedules were posted in a timely manner**", 78, 97], ["The module content included illustrations of clinical relevance**", 71, null], ["The Module Director cared about the students, their progress, and successful course completion**", 88, 100], ["The Module Director was available to students**", 73, null], ["The Module Director was responsive to student feedback**", 77, 100], ["The module learning objectives were clearly defined**", 81, null], ["The module workload was manageable**", 77, 97], ["The module offered meaningful learning opportunities**", null, 90], ["The module learning objectives helped support learning in this module**", null, 94]], "note": "The question set changed between years; items asked in only one year show a single value.", "strengths": [[29, "EBM: students appreciate focus on statistics; relevance to STEP 1; application to research and clinical practice"], [23, "Curriculum: helpful content; engaging"], [19, "N/A: Not applicable"], [16, "Small groups: reinforce material"]], "suggestions": [[32, "N/A: 'Not applicable' or 'None'"], [23, "EBM: various suggestions related to individual student learning styles"], [16, "Curriculum: allot more time to watch videos"]]}, {"label": "Semester 3", "cohort": "ASCEND Class of 2028", "term": "Fall 2025", "n": 30, "rate": "25%", "cols": ["Semester 1, 2024\u201325 (n = 39)", "Semester 2, 2024\u201325 (n = 26)", "Semester 3, 2025\u201326 (n = 30)"], "items3": [["This module had high educational impact**", 41, 50, 77], ["The module workload was manageable**", 79, 77, 93], ["The module learning objectives helped support learning in this module**", null, null, 87], ["Session materials and schedules were posted in a timely manner**", 77, 78, 93], ["The Module Director was responsive to student feedback**", 72, 77, 100], ["The Module Director cared about the students, their progress, and successful course completion**", 74, 88, 100], ["Dr. Henry Sacks clearly communicated key concepts of prevention and screening**", null, null, 100], ["Dr. Bess Storch clearly communicated key concepts of prognosis**", null, null, 100]], "note": "The three columns are the same cohort (Class of 2028) across its three semesters of THINQ.", "ebm": {"n": 24, "items": [["The flipped classroom / pre-recorded lecture format supported my learning**", 83], ["The small group sessions enhanced my understanding of course material**", 87], ["Together, the sessions improved my ability to interpret scientific literature**", 83], ["The EBM sessions reinforced concepts relevant to clinical practice**", 93], ["The content was useful for progress towards preparing for USMLE Step 1**", 73]]}, "strengths": [[30, "Curriculum: biostatistics content; clinical application"], [23, "N/A: 'Not applicable' or 'None'"]], "suggestions": [[37, "N/A: 'Not applicable' or 'None'"], [33, "Curriculum: identify linkage to STEP 1"]]}]};const $=s=>document.querySelector(s);
$('#ttl').textContent=D.module.name;$('#meta').textContent=`${D.module.term} · ${D.module.year} · evaluated by semester · no graded assessments`;$('#foot').textContent=`Aggregate data only. Source: ${D.module.source}. Prepared by the Office of Curricular Affairs.`;
const d=(a,b)=>a==null||b==null?'—':`<span class="${b-a>=0?'up':'down'}">${b-a>=0?'+':''}${b-a}</span>`;
function hbars(rows,x0){const W=560,rh=22,H=rows.length*rh+22,sc=(W-x0-60)/100;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;[0,25,50,75,100].forEach(g=>{const x=x0+g*sc;s+=`<line x1="${x}" y1="4" x2="${x}" y2="${H-18}" stroke="#E2E5EE"/><text x="${x}" y="${H-5}" font-size="10" fill="#6B7280" text-anchor="middle">${g}%</text>`});rows.forEach((r,i)=>{const y=6+i*rh;s+=`<text x="${x0-6}" y="${y+12}" font-size="11" fill="#374151" text-anchor="end">${r.label}</text>`;if(r.v!=null)s+=`<rect x="${x0}" y="${y+2}" width="${r.v*sc}" height="12" fill="#221F72"/><text x="${x0+r.v*sc+4}" y="${y+12}" font-size="10.5" fill="#374151">${r.v}%</text>`;if(r.prior!=null)s+=`<rect x="${x0+r.prior*sc-1}" y="${y}" width="2" height="16" fill="#D80B8C"/>`});return s+'</svg>'}
const themes=(S)=>`<div class="grid"><div class="card"><h3 style="margin-top:0">Strengths</h3><ul class="themes">${S.strengths.map(s=>`<li><b>${s[0]}%</b><span>${s[1]}</span></li>`).join('')}</ul></div><div class="card"><h3 style="margin-top:0">Suggestions for improvement</h3><ul class="themes">${S.suggestions.map(s=>`<li><b>${s[0]}%</b><span>${s[1]}</span></li>`).join('')}</ul></div></div>`;
let nav='',main=`<section class="view on" id="v-overview"><h2>Overview</h2><p>${D.module.intro}</p><table class="stack-m"><thead><tr><th>Semester</th><th>Cohort</th><th>Term</th><th class="num">Respondents</th><th class="num">Response rate</th></tr></thead><tbody>${D.semesters.map(s=>`<tr><td data-label="Semester">${s.label}</td><td data-label="Cohort">${s.cohort}</td><td data-label="Term">${s.term}</td><td class="num" data-label="n">${s.n}</td><td class="num" data-label="Rate">${s.rate}</td></tr>`).join('')}</tbody></table>
<h3>Common questions across semesters (% Agree + Strongly Agree)</h3><table class="stack-m"><thead><tr><th>Question</th><th class="num">Year 1 Sem 1<br>2025–26</th><th class="num">Year 1 Sem 2<br>2025–26</th><th class="num">Sem 3<br>2025–26</th></tr></thead><tbody>
<tr><td>Module Director cared about the students</td><td class="num">97</td><td class="num">100</td><td class="num">100</td></tr>
<tr><td>Module Director was responsive to student feedback</td><td class="num">97</td><td class="num">100</td><td class="num">100</td></tr>
<tr><td>Session materials and schedules posted in a timely manner</td><td class="num">95</td><td class="num">97</td><td class="num">93</td></tr>
<tr><td>Module workload was manageable</td><td class="num">96</td><td class="num">97</td><td class="num">93</td></tr>
<tr><td>Learning objectives helped support learning</td><td class="num">77</td><td class="num">94</td><td class="num">87</td></tr>
<tr><td>Educational impact / meaningful learning opportunities</td><td class="num">80</td><td class="num">90</td><td class="num">77</td></tr></tbody></table><p class="note">Semesters 1 and 2 are the Class of 2029; Semester 3 is the Class of 2028. Wording of the first and last items differs by semester (see each semester's tab).</p></section>`;
nav+=`<button class="on" data-v="overview">Overview</button>`;
D.semesters.forEach((s,i)=>{const id='s'+i;nav+=`<button data-v="${id}">${s.label}</button>`;let h=`<section class="view" id="v-${id}"><h2>${s.label} <span class="pill">${s.cohort} · ${s.term}</span></h2><p class="note">${s.n} students (${s.rate}) completed the evaluation. * % Good + Excellent; ** % Agree + Strongly Agree.${s.note?' '+s.note:''}</p>`;
 if(s.items){h+=`<div class="chart">${hbars(s.items.map(i=>({label:i[0].length>44?i[0].slice(0,42)+'…':i[0],v:i[2],prior:i[1]})),300)}<div class="legend">Bar = ${s.col}.<span class="sw" style="background:#D80B8C"></span>${s.col_prior}.</div></div><table class="stack-m"><thead><tr><th>Question</th><th class="num">${s.col_prior}</th><th class="num">${s.col}</th><th class="num">Change</th></tr></thead><tbody>${s.items.map(i=>`<tr><td data-label="Question">${i[0]}</td><td class="num" data-label="Prior">${i[1]==null?'—':i[1]+'%'}</td><td class="num" data-label="Current">${i[2]==null?'—':i[2]+'%'}</td><td class="num" data-label="Change">${d(i[1],i[2])}</td></tr>`).join('')}</tbody></table>`}
 if(s.items3){h+=`<table class="stack-m"><thead><tr><th>Question</th>${s.cols.map(c=>`<th class="num">${c}</th>`).join('')}</tr></thead><tbody>${s.items3.map(i=>`<tr><td data-label="Question">${i[0]}</td>${[1,2,3].map(k=>`<td class="num" data-label="${s.cols[k-1]}">${i[k]==null?'—':i[k]+'%'}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
 if(s.aoc){h+=`<h3>AOC large-group sessions (% Agree + Strongly Agree, n = ${s.n})</h3><table class="stack-m"><thead><tr><th>Area of Concentration</th><th class="num">Effectively communicated the AOC's foundational principles</th><th class="num">Description accurately represented the content</th><th class="num">Provided new knowledge / skills relevant to my development</th></tr></thead><tbody>${s.aoc.map(a=>`<tr><td data-label="AOC">${a[0]}</td><td class="num" data-label="Principles">${a[1]}%</td><td class="num" data-label="Description">${a[2]}%</td><td class="num" data-label="New knowledge">${a[3]}%</td></tr>`).join('')}</tbody></table>`}
 if(s.ebm){h+=`<h3>EBM content (n = ${s.ebm.n})</h3><table class="stack-m"><thead><tr><th>Item</th><th class="num">% Agree + Strongly Agree</th></tr></thead><tbody>${s.ebm.items.map(i=>`<tr><td data-label="Item">${i[0]}</td><td class="num" data-label="%">${i[1]}%</td></tr>`).join('')}</tbody></table>`}
 h+=`<h3>Student comments (n = ${s.n})</h3>`+themes(s)+`</section>`;main+=h});
$('#nav').innerHTML=nav;$('#main').innerHTML=main;
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('section.view').forEach(s=>s.classList.remove('on'));$('#v-'+b.dataset.v).classList.add('on');window.scrollTo({top:0})}));
</script></body></html>
