const themes=(S)=>`<div class="grid g2"><div class="card"><h3 style="margin-top:0">Strengths</h3><ul class="themes">${S.strengths.map(s=>`<li><b>${s[0]}%</b><span>${s[1]}</span></li>`).join('')}</ul></div><div class="card"><h3 style="margin-top:0">Suggestions for improvement</h3><ul class="themes">${S.suggestions.map(s=>`<li><b>${s[0]}%</b><span>${s[1]}</span></li>`).join('')}</ul></div></div>`;
let nav=`<button class="on" data-v="overview">Overview</button>`;
let main=`<section class="view on" id="v-overview"><h2>Overview</h2><p>${D.module.intro}</p><table class="stack-m"><thead><tr><th>Semester</th><th>Cohort</th><th>Term</th><th class="num">Respondents</th><th class="num">Response rate</th></tr></thead><tbody>${D.semesters.map(s=>`<tr><td data-label="Semester">${s.label}</td><td data-label="Cohort">${s.cohort}</td><td data-label="Term">${s.term}</td><td class="num" data-label="n">${s.n}</td><td class="num" data-label="Rate">${s.rate}</td></tr>`).join('')}</tbody></table>
<h3>Common questions across semesters (% Agree + Strongly Agree)</h3><table class="stack-m"><thead><tr><th>Question</th><th class="num">Year 1 Sem 1<br>2025–26</th><th class="num">Year 1 Sem 2<br>2025–26</th><th class="num">Sem 3<br>2025–26</th><th class="num">Trend (Sem 2 → 3)</th></tr></thead><tbody>
${[['Module Director cared about the students',97,100,100],['Module Director was responsive to student feedback',97,100,100],['Session materials and schedules posted in a timely manner',95,97,93],['Module workload was manageable',96,97,93],['Learning objectives helped support learning',77,94,87],['Educational impact / meaningful learning opportunities',80,90,77]].map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td><td class="num">${trend(r[2],r[3])}</td></tr>`).join('')}</tbody></table><p class="note">Semesters 1 and 2 are the Class of 2029; Semester 3 is the Class of 2028. Wording of the first and last items differs by semester (see each semester's tab). Trend: ▲ up 3+ · ● stable (±3) · ▼ down 3+.</p></section>`;
D.semesters.forEach((s,i)=>{const id='s'+i;nav+=`<button data-v="${id}">${s.label}</button>`;let h=`<section class="view" id="v-${id}"><h2>${s.label} <span class="pill">${s.cohort} · ${s.term}</span></h2><p class="note">${s.n} students (${s.rate}) completed the evaluation. * % Good + Excellent; ** % Agree + Strongly Agree.${s.note?' '+s.note:''}</p>`;
 if(s.items){h+=`<div class="chart">${hbars(s.items.map(i=>({label:lab(i[0]),v:i[2],prior:i[1]})),{x0:300})}<div class="legend">Bar = ${s.col}.<span class="sw" style="background:#D80B8C"></span>${s.col_prior}.</div></div><table class="stack-m"><thead><tr><th>Question</th><th class="num">${s.col_prior}</th><th class="num">${s.col}</th><th class="num">Trend</th></tr></thead><tbody>${s.items.map(i=>`<tr><td data-label="Question">${i[0]}</td><td class="num" data-label="Prior">${i[1]==null?'—':i[1]+'%'}</td><td class="num" data-label="Current">${i[2]==null?'—':i[2]+'%'}</td><td class="num" data-label="Trend">${trend(i[1],i[2])}</td></tr>`).join('')}</tbody></table>`}
 if(s.items3){h+=`<table class="stack-m"><thead><tr><th>Question</th>${s.cols.map(c=>`<th class="num">${c}</th>`).join('')}<th class="num">Trend (Sem 2 → 3)</th></tr></thead><tbody>${s.items3.map(i=>`<tr><td data-label="Question">${i[0]}</td>${[1,2,3].map(k=>`<td class="num" data-label="${s.cols[k-1]}">${i[k]==null?'—':i[k]+'%'}</td>`).join('')}<td class="num" data-label="Trend">${trend(i[2],i[3])}</td></tr>`).join('')}</tbody></table>`}
 if(s.aoc){h+=`<h3>AOC large-group sessions (% Agree + Strongly Agree, n = ${s.n})</h3><table class="stack-m"><thead><tr><th>Area of Concentration</th><th class="num">Effectively communicated the AOC's foundational principles</th><th class="num">Description accurately represented the content</th><th class="num">Provided new knowledge / skills relevant to my development</th></tr></thead><tbody>${s.aoc.map(a=>`<tr><td data-label="AOC">${a[0]}</td><td class="num" data-label="Principles">${a[1]}%</td><td class="num" data-label="Description">${a[2]}%</td><td class="num" data-label="New knowledge">${a[3]}%</td></tr>`).join('')}</tbody></table>`}
 if(s.ebm){h+=`<h3>EBM content (n = ${s.ebm.n})</h3><table class="stack-m"><thead><tr><th>Item</th><th class="num">% Agree + Strongly Agree</th></tr></thead><tbody>${s.ebm.items.map(i=>`<tr><td data-label="Item">${i[0]}</td><td class="num" data-label="%">${i[1]}%</td></tr>`).join('')}</tbody></table>`}
 h+=`<h3>Student comments (n = ${s.n})</h3>`+themes(s)+`</section>`;main+=h});
$('#nav').innerHTML=nav;$('#main').innerHTML=main;tabs();

</script></body></html>
