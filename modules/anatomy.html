<script>

const $=s=>document.querySelector(s);
const f1=v=>v==null?'—':Number(v).toFixed(1);
const pct=(n,d)=>d?Math.round(100*n/d)+'%':'—';
const fmt=v=>v==null?'—':v;
const trend=(a,b,thr=3)=>{if(a==null||b==null)return '<span class="tr na">—</span>';const d=b-a;const s=(d>0?'+':'')+(Number.isInteger(d)?d:d.toFixed(1));if(d>=thr)return `<span class="tr up" data-tip="Up ${s} points versus the prior cohort or year">▲ ${s}</span>`;if(d<=-thr)return `<span class="tr down" data-tip="Down ${s} points versus the prior cohort or year">▼ ${s}</span>`;return `<span class="tr flat" data-tip="Stable: ${s} points versus prior, within the ±${thr}-point band">● ${s}</span>`};
const TRLEG='<p class="note">Trend vs prior: <span class="tr up">▲</span> up 3 points or more · <span class="tr flat">●</span> stable (within ±3) · <span class="tr down">▼</span> down 3 points or more.</p>';
function hist(counts,edges,opts={}){const W=560,H=200,x0=34,y0=170,mx=Math.max(...counts,1)*1.15,pw=(W-x0-10)/counts.length,sc=(y0-14)/mx;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 for(let g=0;g<=mx;g+=Math.ceil(mx/4)){const y=y0-g*sc;s+=`<line x1="${x0}" y1="${y}" x2="${W-10}" y2="${y}" stroke="#E2E5EE"/><text x="${x0-4}" y="${y+4}" font-size="10" fill="#6B7280" text-anchor="end">${g}</text>`}
 counts.forEach((c,i)=>{const x=x0+i*pw;const lo=edges[i],hi=edges[i+1];const col=opts.color||'#221F72';s+=`<rect x="${x+3}" y="${y0-c*sc}" width="${pw-6}" height="${c*sc}" fill="${col}"/><text x="${x+pw/2}" y="${y0-c*sc-3}" font-size="10" fill="#374151" text-anchor="middle">${c}</text><text x="${x+pw/2}" y="${y0+13}" font-size="10" fill="#6B7280" text-anchor="middle">${lo}–${i<counts.length-1?hi-1:hi}</text>`});
 if(opts.line!=null){const x=x0+(opts.line-edges[0])/(edges[1]-edges[0])*pw;s+=`<line x1="${x}" y1="6" x2="${x}" y2="${y0}" stroke="#D80B8C" stroke-width="2" stroke-dasharray="5,4"/><text x="${x+4}" y="14" font-size="11" fill="#D80B8C" font-weight="700">${opts.lineLabel||opts.line}</text>`}
 return s+'</svg>'}
function wrap(s,n){const w=s.split(' ');const lines=[];let cur='';w.forEach(x=>{if((cur+' '+x).trim().length>n&&cur){lines.push(cur);cur=x}else cur=(cur+' '+x).trim()});if(cur)lines.push(cur);return lines.slice(0,3)}
function hbars(rows,opts={}){const W=560,x0=opts.x0||170,wide=x0>250,fs=wide?9:11,maxc=wide?Math.floor((x0-10)/4.6):26;const L=rows.map(r=>wide?wrap(r.label,maxc):[r.label]);const rh=L.map(l=>Math.max(16,l.length*(fs+2)+6));const H=rh.reduce((a,b)=>a+b,0)+26,sc=(W-x0-60)/100;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 (wide?[0,25,50,75,100]:[50,60,70,80,90,100]).forEach(g=>{const x=x0+g*sc;s+=`<line x1="${x}" y1="4" x2="${x}" y2="${H-18}" stroke="#E2E5EE"/><text x="${x}" y="${H-5}" font-size="10" fill="#6B7280" text-anchor="middle">${g}%</text>`});
 let y=6;rows.forEach((r,i)=>{const h=rh[i],lines=L[i],by=y+h/2-6;const ty=y+h/2-(lines.length-1)*(fs+2)/2+fs/2-1;lines.forEach((ln,k)=>{s+=`<text x="${x0-6}" y="${ty+k*(fs+2)}" font-size="${fs}" fill="#374151" text-anchor="end">${ln}</text>`});if(r.v!=null)s+=`<rect x="${x0}" y="${by}" width="${r.v*sc}" height="12" fill="${r.color||'#221F72'}"/>`;if(r.prior!=null)s+=`<rect x="${x0+r.prior*sc-1}" y="${by-2}" width="2" height="16" fill="#D80B8C"/>`;if(r.v!=null)s+=`<text x="${x0+r.v*sc+4}" y="${by+10}" font-size="10.5" fill="#374151">${Number.isInteger(r.v)?r.v:f1(r.v)}${r.suffix||'%'}</text>`;y+=h});
 return s+'</svg>'}

 if(E.col_prior){const cols=E.cols||[E.col_prior,E.col];h+=TRLEG+`<table class="stack-m"><thead><tr><th>Question</th>${cols.map(c=>`<th class="num">${c}</th>`).join('')}<th class="num">Trend</th></tr></thead><tbody>${E.items.map(i=>`<tr><td data-label="Question">${i[0]}</td>${i.slice(1).map((v,k)=>`<td class="num" data-label="${cols[k]}">${v==null?'—':v+'%'}</td>`).join('')}<td class="num" data-label="Trend">${trend(prev(i),last(i))}</td></tr>`).join('')}</tbody></table>`}
 if(E.extra)E.extra.forEach(x=>{const tr=x.cols.length>=2&&x.rows.some(r=>typeof r[r.length-1]==='number'&&typeof r[r.length-2]==='number');h+=`<h3>${x.title}</h3>`+(x.note?`<p class="note">${x.note}</p>`:'')+`<table class="stack-m"><thead><tr><th>${x.first||''}</th>${x.cols.map(c=>`<th class="num">${c}</th>`).join('')}${tr?'<th class="num">Trend</th>':''}</tr></thead><tbody>${x.rows.map(r=>`<tr><td data-label="${x.first||''}">${r[0]}</td>${r.slice(1).map((v,k)=>`<td class="num" data-label="${x.cols[k]}">${v==null?'—':(typeof v==='number'?v+'%':v)}</td>`).join('')}${tr?`<td class="num" data-label="Trend">${(typeof r[r.length-1]==='number'&&typeof r[r.length-2]==='number')?trend(r[r.length-2],r[r.length-1]):'<span class="tr na">—</span>'}</td>`:''}</tr>`).join('')}</tbody></table>`});
 h+=`<div class="grid g2" style="margin-top:14px"><div class="card"><h3 style="margin-top:0">Strengths (themes named by ≥10% of respondents)</h3><ul class="themes">${E.strengths.map(s=>`<li><b>${s[0]}%</b><span>${s[1]}</span></li>`).join('')}</ul></div><div class="card"><h3 style="margin-top:0">Suggestions for improvement</h3><ul class="themes">${E.suggestions.map(s=>`<li><b>${s[0]}%</b><span>${s[1]}</span></li>`).join('')}</ul></div></div>`;
 if(E.ops)h+=`<h3>Curricular Affairs operations</h3><div class="card"><ul>${E.ops.map(o=>`<li>${o}</li>`).join('')}</ul></div>`;
 if(D.hours)h+=`<h2>Curricular structure <span class="pill">${M.year} · CODA calendar</span></h2><table class="stack-m"><thead><tr><th>Method</th><th class="num">Sessions</th><th class="num">Hours</th><th class="num">% of hours</th></tr></thead><tbody>${D.hours.rows.map(r=>`<tr><td data-label="Method">${r[0]}</td><td class="num" data-label="Sessions">${r[1]}</td><td class="num" data-label="Hours">${r[2]}</td><td class="num" data-label="%">${Math.round(100*r[2]/D.hours.total)}%</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="num"><b>${D.hours.rows.reduce((a,r)=>a+r[1],0)}</b></td><td class="num"><b>${D.hours.total}</b></td><td></td></tr></tbody></table>`;
 if(!D.info&&(D.mapping||D.mapping_note)){h+=`<h2>Curricular mapping</h2>`;(D.mapping||[]).forEach(m=>{h+=`<h3>${m[0]}</h3><ul>${m[1].map(o=>`<li>${o}</li>`).join('')}</ul>`});if(D.mapping_note)h+=`<p class="note">${D.mapping_note}</p>`}
 $('#v-curric').innerHTML=h})();
tabs();

</script></body></html>
