h+=`<div class="chart">${hbars(E.items.map(i=>({label:i[0].length>44?i[0].slice(0,42)+'…':i[0],v:last(i),prior:E.col_prior?prev(i):null})),{x0:300})}<div class="legend">Bar = ${E.col}.${E.col_prior?`<span class="sw" style="background:#D80B8C"></span>${E.col_prior}.`:''}</div></div>`;

if(E.extra)E.extra.forEach(x=>{const tr=x.cols.length>=2&&x.rows.some(r=>typeof r[r.length-1]==='number'&&typeof r[r.length-2]==='number');h+=`<h3>${x.title}</h3>`+(x.note?`<p class="note">${x.note}</p>`:'')+`<table class="stack-m"><thead><tr><th>${x.first||''}</th>${x.cols.map(c=>`<th class="num">${c}</th>`).join('')}${tr?'<th class="num">Trend</th>':''}</tr></thead><tbody>${x.rows.map(r=>`<tr><td data-label="${x.first||''}">${r[0]}</td>${r.slice(1).map((v,k)=>`<td class="num" data-label="${x.cols[k]}">${v==null?'—':(typeof v==='number'?v+'%':v)}</td>`).join('')}${tr?`<td class="num" data-label="Trend">${(typeof r[r.length-1]==='number'&&typeof r[r.length-2]==='number')?trend(r[r.length-2],r[r.length-1]):'<span class="tr na">—</span>'}</td>`:''}</tr>`).join('')}</tbody></table>`});
h+=`<div class="grid g2" style="margin-top:14px"><div class="card"><h3 style="margin-top:0">Strengths (themes named by ≥10% of respondents)</h3><ul class="themes">${E.strengths.map(s=>`<li><b>${s[0]}%</b><span>${s[1]}</span></li>`).join('')}</ul></div><div class="card"><h3 style="margin-top:0">Suggestions for improvement</h3><ul class="themes">${E.suggestions.map(s=>`<li><b>${s[0]}%</b><span>${s[1]}</span></li>`).join('')}</ul></div></div>`;
if(E.ops)h+=`<h3>Curricular Affairs operations</h3><div class="card"><ul>${E.ops.map(o=>`<li>${o}</li>`).join('')}</ul></div>`;
if(D.hours)h+=`<h2>Curricular structure <span class="pill">${M.year} · CODA calendar</span></h2><table class="stack-m"><thead><tr><th>Method</th><th class="num">Sessions</th><th class="num">Hours</th><th class="num">% of hours</th></tr></thead><tbody>${D.hours.rows.map(r=>`<tr><td data-label="Method">${r[0]}</td><td class="num" data-label="Sessions">${r[1]}</td><td class="num" data-label="Hours">${r[2]}</td><td class="num" data-label="%">${Math.round(100*r[2]/D.hours.total)}%</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="num"><b>${D.hours.rows.reduce((a,r)=>a+r[1],0)}</b></td><td class="num"><b>${D.hours.total}</b></td><td></td></tr></tbody></table>`;
if(D.mapping||D.mapping_note){h+=`<h2>Curricular mapping</h2>`;(D.mapping||[]).forEach(m=>{h+=`<h3>${m[0]}</h3><ul>${m[1].map(o=>`<li>${o}</li>`).join('')}</ul>`});if(D.mapping_note)h+=`<p class="note">${D.mapping_note}</p>`}
$('#v-curric').innerHTML=h})();
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('section.view').forEach(s=>s.classList.remove('on'));$('#v-'+b.dataset.v).classList.add('on');window.scrollTo({top:0})}));
</script></body></html>
