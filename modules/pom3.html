l sciences to care for patients", ["Apply clinical reasoning to complex inpatient and outpatient cases"]], ["KP 9. Apply established and emerging principles of clinical sciences to diagnostic and therapeutic decision-making", ["Apply clinical reasoning to complex inpatient and outpatient cases", "Formulate diagnostic and therapeutic plans using clinical guidelines and evidence", "Participate in inpatient rounding simulations"]], ["KP 11. Apply principles of social-behavioral sciences to the delivery of healthcare", ["Communicate with patients in emotionally charged situations, including responding to strong emotions and delivering serious news", "Engage patients and caregivers in shared decision-making and patient education"]], ["PBLI 13. Locate, appraise, and assimilate evidence from scientific studies", ["Formulate diagnostic and therapeutic plans using clinical guidelines and evidence"]], ["P 15. Demonstrate ethical principles in the care of patients", ["Identify and analyze ethical issues related to patient care"]], ["P 16. Exhibit the behaviors of honesty, integrity, and respect", ["Communicate with patients in emotionally charged situations", "Identify and analyze ethical issues related to patient care", "Demonstrate the professional attributes required for effective patient-physician and interprofessional relationships"]], ["PPD 17. Evaluate one's personal, professional, and educational needs through reflection", ["Demonstrate the professional attributes required for effective patient-physician and interprofessional relationships"]], ["PPD 18. Employ strategies for seeking, receiving, acting upon and delivering feedback", ["Demonstrate the professional attributes required for effective patient-physician and interprofessional relationships"]], ["ICS 19. Communicate effectively with patients, families, and caregivers", ["Communicate with patients in emotionally charged situations", "Engage patients and caregivers in shared decision-making and patient education", "Conduct triadic interviews using the electronic health record as a shared tool during simulated outpatient encounters"]], ["ICS 20. Communicate effectively with colleagues and other health professionals", ["Conduct triadic interviews using the electronic health record as a shared tool", "Navigate a simulated electronic health record to extract, interpret, and document clinical information", "Participate in inpatient rounding simulations"]], ["ICS 21. Maintain comprehensive, timely medical records", ["Conduct triadic interviews using the electronic health record as a shared tool", "Navigate a simulated electronic health record", "Participate in inpatient rounding simulations"]]], "mapping_note": "MEPOs with no module objective mapped: PC 6, 7; KP 10, 12; PBLI 14; ICS 22; SBP 23."};const $=s=>document.querySelector(s);const M=D.module,F=D.final||null;

h+=`<div class="grid g2" style="margin-top:14px"><div class="card"><h3 style="margin-top:0">Strengths (themes named by ≥10% of respondents)</h3><ul class="themes">${E.strengths.map(s=>`<li><b>${s[0]}%</b><span>${s[1]}</span></li>`).join('')}</ul></div><div class="card"><h3 style="margin-top:0">Suggestions for improvement</h3><ul class="themes">${E.suggestions.map(s=>`<li><b>${s[0]}%</b><span>${s[1]}</span></li>`).join('')}</ul></div></div>`;
if(E.ops)h+=`<h3>Curricular Affairs operations</h3><div class="card"><ul>${E.ops.map(o=>`<li>${o}</li>`).join('')}</ul></div>`;
if(D.hours)h+=`<h2>Curricular structure <span class="pill">${M.year} · CODA calendar</span></h2><table class="stack-m"><thead><tr><th>Method</th><th class="num">Sessions</th><th class="num">Hours</th><th class="num">% of hours</th></tr></thead><tbody>${D.hours.rows.map(r=>`<tr><td data-label="Method">${r[0]}</td><td class="num" data-label="Sessions">${r[1]}</td><td class="num" data-label="Hours">${r[2]}</td><td class="num" data-label="%">${Math.round(100*r[2]/D.hours.total)}%</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="num"><b>${D.hours.rows.reduce((a,r)=>a+r[1],0)}</b></td><td class="num"><b>${D.hours.total}</b></td><td></td></tr></tbody></table>`;
if(D.mapping||D.mapping_note){h+=`<h2>Curricular mapping</h2>`;(D.mapping||[]).forEach(m=>{h+=`<h3>${m[0]}</h3><ul>${m[1].map(o=>`<li>${o}</li>`).join('')}</ul>`});if(D.mapping_note)h+=`<p class="note">${D.mapping_note}</p>`}
$('#v-curric').innerHTML=h})();
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('section.view').forEach(s=>s.classList.remove('on'));$('#v-'+b.dataset.v).classList.add('on');window.scrollTo({top:0})}));
</script></body></html>
