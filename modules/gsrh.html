<script>

const $=s=>document.querySelector(s);
const f1=v=>v==null?'—':Number(v).toFixed(1);
const pct=(n,d)=>d?Math.round(100*n/d)+'%':'—';
const fmt=v=>v==null?'—':v;
const trend=(a,b,thr=3)=>{if(a==null||b==null)return '<span class="tr na">—</span>';const d=b-a;const s=(d>0?'+':'')+(Number.isInteger(d)?d:d.toFixed(1));if(d>=thr)return `<span class="tr up" title="up ${s} vs prior">▲ ${s}</span>`;if(d<=-thr)return `<span class="tr down" title="down ${s} vs prior">▼ ${s}</span>`;return `<span class="tr flat" title="stable (${s})">● ${s}</span>`};

function hist(counts,edges,opts={}){const W=560,H=200,x0=34,y0=170,mx=Math.max(...counts,1)*1.15,pw=(W-x0-10)/counts.length,sc=(y0-14)/mx;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 for(let g=0;g<=mx;g+=Math.ceil(mx/4)){const y=y0-g*sc;s+=`<line x1="${x0}" y1="${y}" x2="${W-10}" y2="${y}" stroke="#E2E5EE"/><text x="${x0-4}" y="${y+4}" font-size="10" fill="#6B7280" text-anchor="end">${g}</text>`}
 counts.forEach((c,i)=>{const x=x0+i*pw;const lo=edges[i],hi=edges[i+1];const col=opts.color||'#221F72';s+=`<rect x="${x+3}" y="${y0-c*sc}" width="${pw-6}" height="${c*sc}" fill="${col}"/><text x="${x+pw/2}" y="${y0-c*sc-3}" font-size="10" fill="#374151" text-anchor="middle">${c}</text><text x="${x+pw/2}" y="${y0+13}" font-size="10" fill="#6B7280" text-anchor="middle">${lo}–${i<counts.length-1?hi-1:hi}</text>`});
 if(opts.line!=null){const x=x0+(opts.line-edges[0])/(edges[1]-edges[0])*pw;s+=`<line x1="${x}" y1="6" x2="${x}" y2="${y0}" stroke="#D80B8C" stroke-width="2" stroke-dasharray="5,4"/><text x="${x+4}" y="14" font-size="11" fill="#D80B8C" font-weight="700">${opts.lineLabel||opts.line}</text>`}
 return s+'</svg>'}
function wrap(s,n){const w=s.split(' ');const lines=[];let cur='';w.forEach(x=>{if((cur+' '+x).trim().length>n&&cur){lines.push(cur);cur=x}else cur=(cur+' '+x).trim()});if(cur)lines.push(cur);return lines.slice(0,3)}
function hbars(rows,opts={}){const W=560,x0=opts.x0||170,wide=x0>250,fs=wide?9:11,maxc=wide?Math.floor((x0-10)/4.6):26;const L=rows.map(r=>wide?wrap(r.label,maxc):[r.label]);const rh=L.map(l=>Math.max(16,l.length*(fs+2)+6));const H=rh.reduce((a,b)=>a+b,0)+26,sc=(W-x0-60)/100;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 (wide?[0,25,50,75,100]:[50,60,70,80,90,100]).forEach(g=>{const x=x0+g*sc;s+=`<line x1="${x}" y1="4" x2="${x}" y2="${H-18}" stroke="#E2E5EE"/><text x="${x}" y="${H-5}" font-size="10" fill="#6B7280" text-anchor="middle">${g}%</text>`});
 let y=6;rows.forEach((r,i)=>{const h=rh[i],lines=L[i],by=y+h/2-6;const ty=y+h/2-(lines.length-1)*(fs+2)/2+fs/2-1;lines.forEach((ln,k)=>{s+=`<text x="${x0-6}" y="${ty+k*(fs+2)}" font-size="${fs}" fill="#374151" text-anchor="end">${ln}</text>`});if(r.v!=null)s+=`<rect x="${x0}" y="${by}" width="${r.v*sc}" height="12" fill="${r.color||'#221F72'}"/>`;if(r.prior!=null)s+=`<rect x="${x0+r.prior*sc-1}" y="${by-2}" width="2" height="16" fill="#D80B8C"/>`;if(r.v!=null)s+=`<text x="${x0+r.v*sc+4}" y="${by+10}" font-size="10.5" fill="#374151">${Number.isInteger(r.v)?r.v:f1(r.v)}${r.suffix||'%'}</text>`;y+=h});
 return s+'</svg>'}
const lab=s=>s;

const D={"module": {"name": "Genitourinary, Sexual & Reproductive Health", "short": "GU-SRH", "code": "", "term": "Fall 2025", "cohort": "ASCEND Class of 2028", "year": "AY 2025\u201326", "n": null, "passing": 65, "source": "AY 2025\u201326 student evaluation summary (Question Analysis report; Coded Comment report)"}, "evaluation": {"n": 59, "rate": "50%", "col_prior": "Legacy 2024\u201325 (n = 43)", "col": "ASCEND 2025\u201326 (Class of 2028, n = 59)", "items": [["This module had high educational impact**", 77, 71], ["Exams assessed concepts stated in learning objectives and emphasized in class**", 93, 86], ["Organization and flow of module content*", 77, 33], ["Overall faculty teaching*", 77, 37], ["Session materials and schedules were posted in a timely manner**", 91, 86], ["The module content included illustrations of clinical relevance**", 89, 88], ["The Module Director cared about the students, their progress, and successful module completion**", 89, 89], ["The Module Director was available to students**", 86, 90], ["The Module Director was responsive to student feedback**", 82, 81], ["The module learning objectives helped support learning in this module**", 89, 83], ["The module learning objectives were clearly defined**", 91, 80], ["The module workload was manageable**", 93, 93], ["This module was useful in progress towards preparing for STEP 1**", 81, 86]], "strengths": [[20, "N/A: 'Not applicable' or 'None'"], [19, "CCSG: provide clinical context; reinforce lecture material"], [17, "Lab: helpful to reinforce content"], [17, "Curriculum: organization of content; workload"], [15, "MD: module directors are kind, caring"], [14, "Educators: quality of teaching; passionate"], [12, "Review: helpful review session"]], "suggestions": [[34, "Slides: too much text / content on lecture slides; organization of content on slides"], [25, "N/A: 'Not applicable' or 'None'"], [22, "Curriculum: improve order of content; increase content on embryology / reduce pathology"], [19, "Lab \u2014 student teaching: students only focus on the one case they had to present; students teaching before understanding material"], [17, "Lecture: organization of lecture content"], [15, "Lab: structure not effective; content better as a CCSG"], [10, "Organization: cancellation of lectures"], [10, "Lab \u2014 educators: faculty unprepared; preceptors should teach material"]], "note": "Four-point scales (no \"Neither\"). Comparison year is the legacy curriculum.", "extra": [{"title": "Laboratory sessions (% Agree + Strongly Agree, 2025\u201326)", "first": "Item", "cols": ["ASCEND 2025\u201326 (n = 59)"], "rows": [["Participating in the lab sessions helped reinforce lecture content", 53], ["The lab leaders' ability to facilitate learning", 57], ["The lab leaders' rapport with students", 64]]}]}};const M=D.module,F=D.final||null;
if(!F){$('nav button[data-v="module"]').remove();$('nav button[data-v="assess"]').remove();$('nav button[data-v="curric"]').classList.add('on');$('#v-module').classList.remove('on');$('#v-curric').classList.add('on')}else if(!D.summative||!D.summative.length){$('nav button[data-v="assess"]').remove()}
$('#ttl').textContent=`${M.name}${M.code?` (${M.code})`:''}`;$('#meta').textContent=`${M.cohort} · ${M.term} · ${M.year}${M.n?` · ${M.n} students`:''} · ${F?'Review-level data (no item-level analysis on file)':'Student evaluation only — module review not yet on file'}`;
$('#foot').textContent=`Aggregate data only. Source: ${M.source}. Prepared by the Office of Curricular Affairs.`;
function bandRow(labels,bands,n){return labels.map((l,i)=>{const cls=labels.length===5?(i<2?'bx':i===2?'b1':i===3?'b2':'b3'):'b'+i;return `<td class="c" data-label="${l}"><span class="band ${cls}">${bands[i]}</span><br><small>${pct(bands[i],n)}</small></td>`}).join('')}
function bandHead(labels){return labels.map(l=>`<th class="c">${l}</th>`).join('')}
// MODULE
(function(){if(!F)return;let h=`<h2>Outcome</h2><div class="grid g4">`;
 h+=F.mean!=null?`<div class="stat"><div class="n">${F.mean}%</div><div class="l">Mean final module grade</div><div class="s">median ${F.median} · SD ${F.sd}</div></div>`:`<div class="stat"><div class="n">P/F</div><div class="l">Pass by completion</div><div class="s">${M.passing}</div></div>`;
 h+=`<div class="stat green"><div class="n">${F.pass} / ${F.fail}</div><div class="l">Pass / fail</div><div class="s">${F.incomplete} incomplete${M.n?` · of ${M.n}`:''}</div></div>`;
 if(F.bands)h+=`<div class="stat mag"><div class="n">${F.bands[1]}</div><div class="l">Within 5 points of passing (65–69%)</div><div class="s">${F.bands[0]} below 65%</div></div><div class="stat cyan"><div class="n">${F.bands[3]}</div><div class="l">At or above 75%</div><div class="s">${pct(F.bands[3],M.n)} of the cohort</div></div>`;

 if(F.bands)h+=`<h3>Final module grade bands</h3><table class="stack-m"><thead><tr><th></th>${bandHead(F.labels)}</tr></thead><tbody><tr><td>Final module grade</td>${bandRow(F.labels,F.bands,M.n)}</tr></tbody></table><p class="note">Passing = ${M.passing}%.${D.final_note?' '+D.final_note:''}</p>`;else h+=`<p class="note">${D.final_note||''}</p>`;

 if(D.summative&&D.summative.length)h+=`<h2>Summative assessments</h2><div class="chart">${hbars(D.summative.map(s=>({label:s.name.length>34?s.name.slice(0,32)+'…':s.name,v:s.meanpct!=null?s.meanpct:(typeof s.mean==='number'?s.mean:parseFloat(s.mean))})),{x0:220})}<div class="legend">Mean score (%) per summative component.</div></div>`;

(function(){if(!D.summative||!D.summative.length)return;const hasT=D.summative.some(s=>s.target!=null);let h=`<h2>Summative assessment results</h2><table class="stack-m"><thead><tr><th>Assessment</th><th class="num">Points</th>${hasT?'<th class="num">Target difficulty</th>':''}<th class="num">Mean</th><th class="num">Median</th><th class="num">Range</th>${bandHead(D.summative[0].labels)}</tr></thead><tbody>`;

// CURRIC
(function(){const E=D.evaluation;const last=i=>i[i.length-1],prev=i=>i[i.length-2];
 let h=`<h2>Student evaluation of module <span class="pill">${M.cohort} · ${M.year}</span></h2><p class="note">${E.n} students${E.rate&&E.rate!=='—'?` (${E.rate})`:''} completed the evaluation.${E.col_prior?` Comparison column: ${E.col_prior}.`:''} * % Good + Excellent; ** % Agree + Strongly Agree.${E.note?' '+E.note:''}</p>`;
 h+=`<div class="chart">${hbars(E.items.map(i=>({label:lab(i[0]),v:last(i),prior:E.col_prior?prev(i):null})),{x0:300})}<div class="legend">Bar = ${E.col}.${E.col_prior?`<span class="sw" style="background:#D80B8C"></span>${E.col_prior}.`:''}</div></div>`;
 if(E.col_prior){const cols=E.cols||[E.col_prior,E.col];h+=TRLEG+`<table class="stack-m"><thead><tr><th>Question</th>${cols.map(c=>`<th class="num">${c}</th>`).join('')}<th class="num">Trend</th></tr></thead><tbody>${E.items.map(i=>`<tr><td data-label="Question">${i[0]}</td>${i.slice(1).map((v,k)=>`<td class="num" data-label="${cols[k]}">${v==null?'—':v+'%'}</td>`).join('')}<td class="num" data-label="Trend">${trend(prev(i),last(i))}</td></tr>`).join('')}</tbody></table>`}
 if(E.extra)E.extra.forEach(x=>{const tr=x.cols.length>=2&&x.rows.some(r=>typeof r[r.length-1]==='number'&&typeof r[r.length-2]==='number');h+=`<h3>${x.title}</h3>`+(x.note?`<p class="note">${x.note}</p>`:'')+`<table class="stack-m"><thead><tr><th>${x.first||''}</th>${x.cols.map(c=>`<th class="num">${c}</th>`).join('')}${tr?'<th class="num">Trend</th>':''}</tr></thead><tbody>${x.rows.map(r=>`<tr><td data-label="${x.first||''}">${r[0]}</td>${r.slice(1).map((v,k)=>`<td class="num" data-label="${x.cols[k]}">${v==null?'—':(typeof v==='number'?v+'%':v)}</td>`).join('')}${tr?`<td class="num" data-label="Trend">${(typeof r[r.length-1]==='number'&&typeof r[r.length-2]==='number')?trend(r[r.length-2],r[r.length-1]):'<span class="tr na">—</span>'}</td>`:''}</tr>`).join('')}</tbody></table>`});
 h+=`<div class="grid g2" style="margin-top:14px"><div class="card"><h3 style="margin-top:0">Strengths (themes named by ≥10% of respondents)</h3><ul class="themes">${E.strengths.map(s=>`<li><b>${s[0]}%</b><span>${s[1]}</span></li>`).join('')}</ul></div><div class="card"><h3 style="margin-top:0">Suggestions for improvement</h3><ul class="themes">${E.suggestions.map(s=>`<li><b>${s[0]}%</b><span>${s[1]}</span></li>`).join('')}</ul></div></div>`;
 if(E.ops)h+=`<h3>Curricular Affairs operations</h3><div class="card"><ul>${E.ops.map(o=>`<li>${o}</li>`).join('')}</ul></div>`;
 if(D.hours)h+=`<h2>Curricular structure <span class="pill">${M.year} · CODA calendar</span></h2><table class="stack-m"><thead><tr><th>Method</th><th class="num">Sessions</th><th class="num">Hours</th><th class="num">% of hours</th></tr></thead><tbody>${D.hours.rows.map(r=>`<tr><td data-label="Method">${r[0]}</td><td class="num" data-label="Sessions">${r[1]}</td><td class="num" data-label="Hours">${r[2]}</td><td class="num" data-label="%">${Math.round(100*r[2]/D.hours.total)}%</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="num"><b>${D.hours.rows.reduce((a,r)=>a+r[1],0)}</b></td><td class="num"><b>${D.hours.total}</b></td><td></td></tr></tbody></table>`;
 if(D.mapping||D.mapping_note){h+=`<h2>Curricular mapping</h2>`;(D.mapping||[]).forEach(m=>{h+=`<h3>${m[0]}</h3><ul>${m[1].map(o=>`<li>${o}</li>`).join('')}</ul>`});if(D.mapping_note)h+=`<p class="note">${D.mapping_note}</p>`}
 $('#v-curric').innerHTML=h})();
tabs();

</script></body></html>
